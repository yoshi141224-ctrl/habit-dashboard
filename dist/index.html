<!doctype html>
<html lang="ja" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/habit-dashboard/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent browsers from caching this HTML file — assets use hashed filenames for cache-busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Prevent Google Translate / Chrome auto-translate from modifying React-managed DOM nodes.
         Chrome Translate wraps text nodes in <font> elements, which causes React's reconciler
         to throw NOT_FOUND_ERR (DOMException) when it can't find expected child nodes.
         The app UI is natively in Japanese so translation is not needed. -->
    <meta name="google" content="notranslate" />
    <title>習慣ダッシュボード</title>
    <!-- Process OAuth token before React loads — eliminates blank-page flash -->
    <script>
      (function(){
        var h = window.location.hash;
        if (h.indexOf('access_token=') !== -1) {
          var p = new URLSearchParams(h.slice(1));
          var t = p.get('access_token');
          var exp = Date.now() + Number(p.get('expires_in') || 3600) * 1000;
          if (t) {
            localStorage.setItem('hd_gcal_access_token', t);
            localStorage.setItem('hd_gcal_token_expiry', String(exp));
            window.history.replaceState(null, '', location.pathname + location.search);
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="/habit-dashboard/assets/index-oMqMzUrk.js"></script>
    <link rel="stylesheet" crossorigin href="/habit-dashboard/assets/index-BbwqWPkt.css">
  </head>
  <body>
    <!-- class="notranslate" is recognized by Chrome/Google Translate as a signal
         to skip DOM modification for this element and all its children -->
    <div id="root" class="notranslate"></div>
  </body>
</html>
